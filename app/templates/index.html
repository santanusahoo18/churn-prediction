<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container">

        <h1>Customer Churn Prediction</h1>
        <p class="subtitle">Predict whether a telecom customer is likely to churn.</p>

        <form id="churnForm">

            <h2>Customer Information</h2>
            <div class="form-grid">

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Senior Citizen</label>
                    <select id="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Partner</label>
                    <select id="Partner">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Dependents</label>
                    <select id="Dependents">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tenure (Months)</label>
                    <input type="number" id="tenure" min="0" value="12" required>
                </div>

                <div class="form-group">
                    <label>Phone Service</label>
                    <select id="PhoneService">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Paperless Billing</label>
                    <select id="PaperlessBilling">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Monthly Charges</label>
                    <input type="number" id="MonthlyCharges" step="0.01" value="70" required>
                </div>

                <div class="form-group">
                    <label>Total Charges</label>
                    <input type="number" id="TotalCharges" step="0.01" value="840" required>
                </div>

            </div>

            <h2>Services</h2>
            <div class="form-grid">

                <div class="form-group">
                    <label>Multiple Lines</label>
                    <select id="MultipleLines">
                        <option value="No">No</option>
                        <option value="No phone service">No phone service</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Internet Service</label>
                    <select id="InternetService">
                        <option value="DSL">DSL</option>
                        <option value="Fiber optic">Fiber optic</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Online Security</label>
                    <select id="OnlineSecurity">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Online Backup</label>
                    <select id="OnlineBackup">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Device Protection</label>
                    <select id="DeviceProtection">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tech Support</label>
                    <select id="TechSupport">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Streaming TV</label>
                    <select id="StreamingTV">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Streaming Movies</label>
                    <select id="StreamingMovies">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

            </div>

            <h2>Contract & Payment</h2>
            <div class="form-grid">

                <div class="form-group">
                    <label>Contract</label>
                    <select id="Contract">
                        <option value="Month-to-month">Month-to-month</option>
                        <option value="One year">One year</option>
                        <option value="Two year">Two year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="PaymentMethod">
                        <option value="Electronic check">Electronic check</option>
                        <option value="Mailed check">Mailed check</option>
                        <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                        <option value="Credit card (automatic)">Credit card (automatic)</option>
                    </select>
                </div>

            </div>

            <button type="submit">Predict Customer Churn</button>

        </form>

        <div id="result" class="result hidden">
            <h2>Prediction Result</h2>
            <p id="prediction"></p>
            <p id="probability"></p>
        </div>

    </div>

    <script src="/static/js/script.js"></script>

</body>
</html>
